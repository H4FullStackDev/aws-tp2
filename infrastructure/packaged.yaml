AWSTemplateFormatVersion: '2010-09-09'
Description: AWS CloudFormation Template for Infrastructure
Parameters:
  Envname:
    Type: String
    Description: Environment name (e.g votre identifiant sans learning)
    Default: learnaws_ehodia
  BucketName:
    Type: String
    Description: S3 bucket name (e.g votre identifiant sans learning)
    Default: s3-bucket-trigger-lambda
Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${Envname}-LambdaExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName:
          Fn::Sub: ${Envname}-LambdaS3AccessPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            Resource: arn:aws:dynamodb:*:*:table/s3-trigger-db
  LambdaTrigger:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Envname}-${BucketName}
      Handler: main.lambda_handler
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      Runtime: python3.8
      Code:
        ZipFile: "import json\n\ndef lambda_handler(event, context):\n    print(\"\
          Event:\", json.dumps(event))\n    return {\n        'statusCode': 200,\n\
          \        'body': json.dumps('Hello from Lambda!')\n    }\n"
  S3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName:
        Fn::Sub: ${Envname}-${BucketName}
      NotificationConfiguration:
        LambdaConfigurations:
        - Event: s3:ObjectCreated:*
          Function:
            Fn::GetAtt:
            - LambdaTrigger
            - Arn
